version: 2

seeds:
  - name: australian_public_holidays
    description: >
      Australian public holidays across all states and territories,
      sourced from data.gov.au. Used to enrich the date dimension.
    config:
      column_types:
        id: int
        date: bigint
        holiday_name: string
        information: string
        more_information: string
        jurisdiction: string
    columns:
      - name: id
        description: Surrogate identifier for the holiday record.
      - name: date
        description: Holiday date stored as a Unix epoch (bigint). Cast to DATE in stg_public_holidays.
      - name: holiday_name
        description: Official name of the public holiday.
      - name: information
        description: Short description of the holiday.
      - name: more_information
        description: URL or extended information about the holiday.
      - name: jurisdiction
        description: >
          State/territory code or 'National' for nationally observed holidays.
          Values: ACT, NSW, NT, QLD, SA, TAS, VIC, WA, National.
