version: 2

# NOTE: Staging models now read from seeds (ref()) instead of this Athena source.
# This block is kept as documentation of the original source schema only.
# No tests are defined here to avoid running against potentially stale Athena tables.

sources:
  - name: ol
    description: Raw Olist e-commerce data in the olist schema in AWS Athena (reference only).
    schema: olist
    tables:
      - name: orders
        description: One row per order placed on the Olist platform.
      - name: customers
        description: Customer records. customer_id is order-scoped; customer_unique_id is the true unique customer.
      - name: order_items
        description: Line items within an order — one row per product per order.
      - name: order_payments
        description: Payment transactions. An order may have multiple payment rows.
      - name: order_reviews
        description: Customer reviews submitted after order delivery.
      - name: products
        description: Product catalogue with physical dimensions and category metadata.
      - name: sellers
        description: Seller accounts registered on the Olist platform.
      - name: product_category_name_translation
        description: Maps Portuguese product category names to English equivalents.
      - name: australian_public_holidays
        description: Replaced by brazil_public_holidays seed.
