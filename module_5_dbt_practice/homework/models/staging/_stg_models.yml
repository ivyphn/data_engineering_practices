version: 2

models:
  - name: stg_orders
    description: >
      Staging for orders. Timestamps are timezone-converted to Australia/Adelaide.
      One row per order_id.
    columns:
      - name: order_id
        description: Unique order identifier.
        tests: [not_null, unique]
      - name: customer_id
        description: FK to stg_customers.
        tests: [not_null]
      - name: order_status
        description: Current status of the order.
        tests:
          - not_null
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced,
                       processing, created, approved]
      - name: order_purchase_timestamp
        tests: [not_null]

  - name: stg_customers
    description: >
      Staging for customers. Zip code cast to VARCHAR.
      Note: customer_id is order-scoped; customer_unique_id identifies the true customer.
    columns:
      - name: customer_id
        description: Order-scoped customer PK.
        tests: [not_null, unique]
      - name: customer_unique_id
        description: True unique customer identifier.
        tests: [not_null]

  - name: stg_order_items
    description: >
      Staging for order line items. Price and freight_value cast to DECIMAL.
      One row per (order_id, order_item_id).
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: freight_value
        tests: [not_null]

  - name: stg_order_payments
    description: >
      Staging for order payments. Payment amounts cast to DECIMAL.
      An order may have multiple payment rows (e.g. voucher + credit card).
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_sequential
        tests: [not_null]
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value
        tests: [not_null]

  - name: stg_order_reviews
    description: >
      Staging for order reviews. Score cast to INT; verbose column names shortened.
      One row per review_id; multiple reviews per order are possible.
    columns:
      - name: review_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false

  - name: stg_products
    description: >
      Staging for products. Physical dimensions and weight cast to DECIMAL.
      Text-length metrics cast to INT.
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: product_weight_g
        description: Product weight in grams.

  - name: stg_sellers
    description: Staging for sellers. Zip code cast to VARCHAR.
    columns:
      - name: seller_id
        tests: [not_null, unique]

  - name: stg_product_categories
    description: >
      Staging for category name translation. Columns renamed to
      category_name_pt (Portuguese) and category_name_en (English).
    columns:
      - name: category_name_pt
        tests: [not_null, unique]
      - name: category_name_en
        tests: [not_null]

  - name: stg_public_holidays
    description: >
      Staging for Brazilian national public holidays seed (2016–2025).
      holiday_date cast from YYYY-MM-DD string to DATE.
      Replaces the original Australian public holidays seed.
    columns:
      - name: holiday_date
        description: Calendar date of the public holiday.
        tests: [not_null]
      - name: holiday_name
        description: Official Portuguese name of the holiday.
        tests: [not_null]
      - name: holiday_type
        description: national_fixed or national_variable.
        tests:
          - not_null
          - accepted_values:
              values: [national_fixed, national_variable]
