version: 2

models:
  - name: obt_orders
    description: >
      One Big Table at order grain. Pre-joins fct_orders with dim_date,
      dim_customers, and dim_customer_segments. Designed for self-service
      analytics where a single table is preferred over writing joins.
    columns:
      - name: order_id
        description: Natural key for the order.
        tests: [not_null, unique]
      - name: delivery_status
        tests:
          - not_null
          - accepted_values:
              values: [on_time, late, cancelled, in_transit, unknown]
      - name: customer_key
        tests: [not_null]
      - name: gross_order_value
        tests: [not_null]
      - name: customer_segment
        tests: [not_null]
      - name: value_tier
        tests:
          - not_null
          - accepted_values:
              values: [Platinum, Gold, Silver, Bronze]
